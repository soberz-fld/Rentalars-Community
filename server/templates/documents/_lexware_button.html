{% load i18n %}{% comment %}
  DOK-011: hand an invoice or cancellation to Lexware Office; again after an error. Nothing goes over twice.
{% endcomment %}{% if not transfer or transfer.state == "failed" %}<form method="post" action="{% url 'documents:lexware_transfer' document.pk %}" class="inline-form">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">{% if transfer.error_code == "contact_conflict" %}<input type="hidden" name="new_contact" value="1">{% endif %}<button class="link-btn" type="submit"{% if transfer.error_code == "contact_conflict" %} data-confirm="{% translate 'Create the customer in Lexware Office as a new contact and hand the document over?' %}"{% endif %}>{% if transfer.error_code == "contact_conflict" %}{% translate "Hand over as new contact" %}{% elif transfer %}{% translate "Hand over again" %}{% else %}{% translate "Hand to Lexware Office" %}{% endif %}</button></form>{% endif %}
