# Temporary NGINX configuration used during the installation only.
#
# Before a certificate exists, NGINX cannot start the HTTPS part. This file
# answers on port 80 just long enough for Let's Encrypt to check the domain.
# The installation script replaces it by rentalars.conf right afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    location /.well-known/acme-challenge/ {
        root /var/www/rentalars-acme;
    }

    location / {
        return 503;
    }
}
