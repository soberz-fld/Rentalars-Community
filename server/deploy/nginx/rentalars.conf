# NGINX configuration for Rentalars (NFA-030, NFA-035, NFA-048).
#
# The installation script copies this file to /etc/nginx/sites-available/rentalars
# and replaces the placeholders written as @NAME@:
#
#   @DOMAIN@       the host name, e.g. rentalars.example.de
#   @CERTIFICATE@  the certificate file (with the chain)
#   @PRIVATE_KEY@  its private key
#   @DATA_DIR@     the data directory, normally /var/lib/rentalars
#
# NGINX has three jobs here: it speaks HTTPS, it delivers static files itself,
# and it passes everything else to the application through a local socket.

# Requests per address are limited where passwords are tried: the login page,
# the password reset and the login of the API. The application counts failed
# logins as well (AUT-005); this limit already slows a flood down at the door.
limit_req_zone $binary_remote_addr zone=rentalars_login:10m rate=30r/m;

upstream rentalars_app {
    # The application server (gunicorn) listens on this socket; see
    # /etc/systemd/system/rentalars.service.
    server unix:/run/rentalars/gunicorn.sock fail_timeout=0;
}

# --- Requests for any other name: no answer (NFA-049) ---------------------------
# Scanners try the IP address and invented names. They get nothing: on port 80
# the connection is closed, on port 443 the TLS handshake is refused – without
# showing the certificate, which would give away the real name.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# --- Port 80: only certificate renewal and the redirect to HTTPS -----------------

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Let's Encrypt proves through this folder that the domain is ours.
    location /.well-known/acme-challenge/ {
        root /var/www/rentalars-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443: the application ---------------------------------------------------

server {
    # HTTP/2 is switched on in one of two ways, depending on the NGINX at hand:
    # 1.25.1 and newer (Ubuntu 26.04) want the directive "http2 on;" as written
    # here; older ones (Ubuntu 24.04 has 1.24) only know the word "http2" on the
    # listen line. The installation and every update rewrite these lines into
    # the form the installed NGINX understands (adapt_nginx_site in
    # deploy/lib.sh, NFA-063) – do not be surprised to find the other one.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @DOMAIN@;

    # The address of a visitor behind another proxy: [rentalars] trusted_proxies (S8). Empty by default.
    include snippets/rentalars-realip.conf;

    ssl_certificate     @CERTIFICATE@;
    ssl_certificate_key @PRIVATE_KEY@;

    # Current protocol versions only; the ciphers are left to the OpenSSL
    # defaults of the distribution, which follow security updates.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rentalars_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Do not tell the world which NGINX version runs here.
    server_tokens off;

    # A client that sends its request very slowly holds a connection open;
    # many of them can exhaust the server ("slowloris"). They are cut off.
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # Files whose name starts with a dot (.git, .env …) are never delivered.
    location ~ /\. {
        return 404;
    }

    # Uploads: project files up to the size set in the system settings
    # (default 50 MB, NFA-007), the material import up to 25 MB.
    client_max_body_size 510m;

    # The security headers (HSTS, content security policy, no framing) are set
    # by the application itself, so that they are the same in every environment.

    access_log /var/log/nginx/rentalars.access.log;
    error_log  /var/log/nginx/rentalars.error.log;

    # Static files: style sheets, scripts, fonts, icons. Their content only
    # changes with an update, so browsers may keep them for a while.
    location /static/ {
        alias @DATA_DIR@/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Uploaded files are never reachable directly. The application checks the
    # rights of the user and then names the file in an "X-Accel-Redirect"
    # header; only then does NGINX deliver it from here (NFA-007).
    location /protected-media/ {
        internal;
        alias @DATA_DIR@/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    location = /favicon.ico {
        alias @DATA_DIR@/static/img/favicon.svg;
        default_type image/svg+xml;
        access_log off;
    }

    # Where passwords are tried, requests are limited (see the zone above) – and where a secret
    # link stands in for a password: the calendar subscriptions of PER-023.
    location ~ ^/(login/|password-reset/|api/v1/auth/|calendar-feed/) {
        limit_req zone=rentalars_login burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/rentalars-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/rentalars-proxy.conf;
    }
}
