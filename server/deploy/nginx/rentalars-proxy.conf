# How NGINX hands a request to the Rentalars application.
# Installed as /etc/nginx/snippets/rentalars-proxy.conf.

proxy_pass http://rentalars_app;

# The application needs the original host name and must know that the browser
# spoke HTTPS; otherwise it would redirect in circles and build wrong links.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# Only this address is trusted for the lockout after failed logins. NGINX sets
# it; a value sent by the browser is overwritten here.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;

proxy_redirect off;
proxy_http_version 1.1;
proxy_set_header Connection "";

# A PDF of a long packlist or a large import may take a moment. The
# application server ends a request after 120 seconds itself and undoes its
# database changes (deploy/systemd/rentalars.service, --timeout). NGINX waits
# a little longer, so that it is always the application that gives up first
# and the two never disagree about whether the request went through.
proxy_read_timeout 130s;
proxy_send_timeout 130s;
